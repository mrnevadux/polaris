name: Build Polaris Windows (Polaris.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Télécharger le modèle vocal français (Vosk, ~40 Mo)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip -OutFile model.zip
          Expand-Archive model.zip -DestinationPath .
          Move-Item vosk-model-small-fr-0.22 model-fr
          Remove-Item model.zip

      - name: Vérifier l'installation de CustomTkinter et les assets
        shell: pwsh
        run: |
          $ctkRoot = python -c "import customtkinter, pathlib; print(pathlib.Path(customtkinter.__file__).resolve().parent)"
          $theme = Join-Path $ctkRoot "assets/themes/blue.json"
          Write-Host "CustomTkinter root: $ctkRoot"
          Write-Host "Theme expected: $theme"
          if (-not (Test-Path $theme)) {
            throw "Theme CustomTkinter introuvable: $theme"
          }

      - name: Compiler Polaris.exe
        shell: pwsh
        run: |
          $ctkRoot = python -c "import customtkinter, pathlib; print(pathlib.Path(customtkinter.__file__).resolve().parent)"
          $ctkAssets = Join-Path $ctkRoot "assets"

          pyinstaller --noconfirm --clean --name Polaris --noconsole `
            --add-data "model-fr;model-fr" `
            --add-data "$ctkAssets;customtkinter/assets" `
            --collect-all vosk `
            --collect-all customtkinter `
            --collect-all sounddevice `
            --collect-all _sounddevice_data `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import comtypes `
            --hidden-import win32com `
            --hidden-import pythoncom `
            main.py

      - name: Vérifier que Polaris.exe existe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Polaris/Polaris.exe")) {
            throw "Polaris.exe introuvable"
          }

      - name: Vérifier que le thème CustomTkinter est embarqué
        shell: pwsh
        run: |
          $themePath = "dist/Polaris/customtkinter/assets/themes/blue.json"
          Write-Host "Checking: $themePath"
          if (-not (Test-Path $themePath)) {
            throw "Le thème blue.json de CustomTkinter n'a pas été inclus dans l'exécutable."
          }

      - name: Créer l'archive portable
        shell: pwsh
        run: Compress-Archive -Path dist/Polaris -DestinationPath Polaris-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-Windows
          path: Polaris-Windows.zip
