name: Build POLARIS for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download French speech model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip" -OutFile "$env:RUNNER_TEMP\vosk-fr.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\vosk-fr.zip" -DestinationPath "$env:RUNNER_TEMP\vosk-fr" -Force
          Move-Item "$env:RUNNER_TEMP\vosk-fr\vosk-model-small-fr-0.22" "model-fr"

      - name: Check Python source
        run: python -m compileall -q main.py polaris

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name Polaris --collect-all customtkinter --collect-all vosk --add-data "model-fr;model-fr" main.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-Windows
          path: dist/Polaris/
          if-no-files-found: error
