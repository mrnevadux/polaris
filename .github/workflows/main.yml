      - name: Vérifier que le thème CustomTkinter est embarqué
        shell: pwsh
        run: |
          $theme = Get-ChildItem -Path "dist/Polaris" -Filter "blue.json" -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]customtkinter[\\/]assets[\\/]themes[\\/]blue\.json$' } |
            Select-Object -First 1

          if (-not $theme) {
            Write-Host "Fichiers CustomTkinter trouvés dans la sortie :"
            Get-ChildItem -Path "dist/Polaris" -Recurse |
              Where-Object { $_.FullName -match 'customtkinter|blue\.json' } |
              Select-Object -ExpandProperty FullName
            throw "Le thème blue.json de CustomTkinter est absent de la sortie PyInstaller."
          }

          Write-Host "Thème CustomTkinter trouvé : $($theme.FullName)"
