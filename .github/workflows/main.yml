name: Build POLARIS for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Download French speech model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip" -OutFile "$env:RUNNER_TEMP\vosk-fr.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\vosk-fr.zip" -DestinationPath "$env:RUNNER_TEMP\vosk-fr" -Force
          Move-Item "$env:RUNNER_TEMP\vosk-fr\vosk-model-small-fr-0.22" "model-fr"

      - name: Check Python source
        run: python -m compileall -q main.py polaris

      - name: Build Windows executable with Tcl/Tk
        run: pyinstaller --noconfirm --clean --windowed --onedir --name Polaris --collect-all customtkinter --collect-all vosk --hidden-import=tkinter --add-data "model-fr;model-fr" main.py

      - name: Ensure Tcl/Tk runtime files are bundled
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          $tclRoot = Join-Path $pythonRoot "tcl"
          $outputLib = Join-Path (Get-Location) "dist\Polaris\lib"
          $tclSource = Join-Path $tclRoot "tcl8.6"
          $tkSource = Join-Path $tclRoot "tk8.6"

          if (!(Test-Path (Join-Path $tclSource "init.tcl"))) {
            throw "Tcl init.tcl not found at $tclSource"
          }
          if (!(Test-Path (Join-Path $tkSource "tk.tcl"))) {
            throw "Tk tk.tcl not found at $tkSource"
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $outputLib "tcl8.6") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $outputLib "tk8.6") | Out-Null
          Copy-Item (Join-Path $tclSource "*") (Join-Path $outputLib "tcl8.6") -Recurse -Force
          Copy-Item (Join-Path $tkSource "*") (Join-Path $outputLib "tk8.6") -Recurse -Force

          if (!(Test-Path (Join-Path $outputLib "tcl8.6\init.tcl"))) {
            throw "Bundled Tcl init.tcl is missing"
          }
          if (!(Test-Path (Join-Path $outputLib "tk8.6\tk.tcl"))) {
            throw "Bundled Tk tk.tcl is missing"
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-Windows
          path: dist/Polaris/
          if-no-files-found: error
